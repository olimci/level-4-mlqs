[project]
name = "resnet-test"
version = "0.1.0"
description = "ResNet experiment project"
requires-python = ">=3.12"
dependencies = [
    "jax==0.5.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "jax>=0.11.2; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "jax-metal>=0.1.1 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "optax>=0.2.5",
    "pillow>=11.0.0",
]

[project.scripts]
resnet-test = "resnet_test:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
