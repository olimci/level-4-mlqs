[project]
name = "level-4-mlqs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Oliver McInnes", email = "oli@mcinnes.cc" }
]
requires-python = ">=3.12"
dependencies = [
    "jax>=0.11.2",
    "jax-metal>=0.1.1 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[project.scripts]
level-4-mlqs = "level_4_mlqs:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
